      } catch (e) {}
    })();

  <style>
    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --text: #1b1f23;
      --muted: #5b6470;
      --line: #e3e1db;
      --accent: #0b6e6a;
      --accent-soft: #e3f1ef;
      --accent-ink: #ffffff;
      --chip: #eef0ee;
      --chip-text: #2f3a3a;
      --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 8px 24px -12px rgba(20, 24, 28, .18);
      --radius: 12px;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1214; --surface: #171b1f; --text: #e9e7e1; --muted: #9aa3ad; --line: #2a3036;
        --accent: #4fd1c5; --accent-soft: #14302e; --accent-ink: #062321; --chip: #1f262b; --chip-text: #d5dbe0;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.8);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1214; --surface: #171b1f; --text: #e9e7e1; --muted: #9aa3ad; --line: #2a3036;
      --accent: #4fd1c5; --accent-soft: #14302e; --accent-ink: #062321; --chip: #1f262b; --chip-text: #d5dbe0;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.8);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 72px; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-body); font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; text-underline-offset: 3px; }
    a:hover, a:focus-visible { text-decoration: underline; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    img { max-width: 100%; display: block; }
    ul, ol { margin: 0; padding: 0; list-style: none; }
    .bullets { list-style: disc; }
    h1, h2, h3 { margin: 0; line-height: 1.2; }
    p { margin: 0; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
    .skip { position: absolute; left: 16px; top: -100px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 8px; z-index: 100; }
    .skip:focus { top: 12px; }

    /* Top bar */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: saturate(160%) blur(12px); -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; max-width: 1100px; }
    .brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--text); white-space: nowrap; }
    .nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; -webkit-overflow-scrolling: touch; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { color: var(--muted); font-size: 14px; font-weight: 500; padding: 8px 9px; border-radius: 8px; white-space: nowrap; }
    .nav a:hover { color: var(--text); background: var(--chip); text-decoration: none; }
    .actions { display: flex; gap: 8px; margin-left: auto; }
    .btn {
      appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--text);
      font: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; line-height: 1;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { filter: brightness(1.06); text-decoration: none; }
    .btn svg { width: 16px; height: 16px; }
    .btn-icon { padding: 8px; }
    .btn .label { display: none; }
    @media (min-width: 640px) { .btn .label { display: inline; } }

    /* Language toggle */
    .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .lang button { appearance: none; border: 0; background: transparent; padding: 0 8px; height: 34px; display: inline-flex; align-items: center; cursor: pointer; opacity: .55; transition: opacity .15s; }
    .lang button + button { border-left: 1px solid var(--line); }
    .lang button[aria-pressed="true"] { background: var(--accent-soft); opacity: 1; }
    .lang button:hover { opacity: 1; }
    .lang svg { width: 20px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); flex: none; }

    /* Hero */
    .hero { padding: 40px 0 28px; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--surface); box-shadow: var(--shadow); }
    .hero h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); font-weight: 700; letter-spacing: -0.01em; }
    .title { font-size: clamp(17px, 2.4vw, 20px); font-weight: 600; color: var(--accent); margin-top: 6px; }
    .headline { color: var(--muted); font-size: 15px; margin-top: 4px; }
    .contact { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 16px; font-size: 14.5px; }
    .contact li { display: inline-flex; align-items: center; gap: 7px; color: var(--text); }
    .contact svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
    .contact a { color: var(--text); }
    .contact a:hover { color: var(--accent); }
    @media (max-width: 560px) { .hero { grid-template-columns: 1fr; gap: 16px; } .avatar { width: 80px; height: 80px; } }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0 8px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .stat b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.1; }
    .stat span { font-size: 13px; color: var(--muted); }
    @media (max-width: 420px) { .stats { grid-template-columns: 1fr 1fr; } .stats .stat:last-child { grid-column: span 2; } }

    /* Sections */
    section { padding: 36px 0 0; }
    section:last-of-type { padding-bottom: 36px; }
    h2 {
      font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -0.005em;
      display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .lead { font-size: 17px; line-height: 1.7; max-width: 72ch; }

    /* Skills */
    .skills { display: grid; gap: 14px; }
    .skill-group { display: grid; grid-template-columns: 180px 1fr; gap: 6px 16px; align-items: start; }
    .skill-group dt { font-weight: 600; font-size: 14px; color: var(--muted); padding-top: 5px; }
    .skill-group dd { margin: 0; }
    @media (max-width: 560px) { .skill-group { grid-template-columns: 1fr; gap: 4px; } }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tags li { background: var(--chip); color: var(--chip-text); font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 999px; line-height: 1.4; }
    .tags.small li { font-size: 12px; padding: 3px 8px; }

    /* Experience */
    .jobs { display: grid; gap: 6px; position: relative; }
    .job { position: relative; padding: 14px 0 22px 28px; }
    .job::before { content: ""; position: absolute; left: 5px; top: 22px; bottom: -6px; width: 2px; background: var(--line); }
    .job:last-child::before { bottom: 22px; }
    .job::after { content: ""; position: absolute; left: 0; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
    .job-head { display: flex; justify-content: space-between; gap: 8px 20px; align-items: baseline; flex-wrap: wrap; }
    .job h3 { font-size: 18px; font-weight: 700; }
    .job-org { color: var(--muted); font-size: 15px; margin-top: 2px; }
    .job-org a { color: var(--text); font-weight: 600; }
    .job-when { text-align: right; font-size: 14px; color: var(--muted); white-space: nowrap; }
    .job-when time { display: block; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    @media (max-width: 560px) { .job-when { text-align: left; } .job-when time { display: inline; } .job-when .dur::before { content: " · "; } }
    .bullets { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 6px; }
    .bullets li { line-height: 1.55; }
    .bullets li::marker { color: var(--accent); }
    .job .tags { margin-top: 12px; }
    .job-links { margin-top: 10px; font-size: 14px; }
    .job-links a { display: inline-flex; align-items: center; gap: 6px; }
    .job-links svg { width: 14px; height: 14px; }

    /* Projects */
    .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .project { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform .15s ease, box-shadow .15s ease; }
    .project:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .project-media { aspect-ratio: 16 / 10; background: var(--chip); overflow: hidden; }
    .project-media img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .project-body { padding: 14px 16px 16px; display: grid; gap: 8px; flex: 1; }
    .project h3 { font-size: 16px; font-weight: 700; }
    .project h3 a { color: var(--text); }
    .project p { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .project .tags { margin-top: auto; }
    .project-url { font-size: 12.5px; color: var(--muted); word-break: break-all; }

    /* Education / two column blocks */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 32px; }
    @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
    .card h3 { font-size: 17px; font-weight: 700; }
    .card .sub { color: var(--muted); font-size: 14.5px; margin-top: 4px; }
    .card .date { font-size: 14px; font-weight: 600; margin-top: 8px; }
    .card p.desc { font-size: 14.5px; margin-top: 8px; line-height: 1.55; }
    .list { display: grid; gap: 8px; }
    .list li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
    .list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-2px); }
    .h3-sub { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }

    /* Contact */
    .contact-card { background: var(--accent-soft); border-radius: var(--radius); padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; }
    .contact-card p { max-width: 50ch; }
    .contact-card .cta { display: flex; gap: 10px; flex-wrap: wrap; }

    footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 13.5px; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
    .status { padding: 60px 0; color: var(--muted); text-align: center; }
    .status.error { color: #b42318; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- Print: a clean single-column, ATS-parsable document ---------- */
    @media print {
      @page { size: A4; margin: 14mm 15mm 16mm; }
      :root, :root[data-theme="dark"] {
        --bg: #fff; --surface: #fff; --text: #000; --muted: #333; --line: #bbb; --accent: #000;
        --accent-soft: transparent; --chip: transparent; --chip-text: #000; --shadow: none; color-scheme: light;
      }
      html { scroll-padding-top: 0; }
      body { font-size: 10.5pt; line-height: 1.4; background: #fff; }
      .wrap { max-width: none; padding: 0; }
      .topbar, .skip, .stats, .avatar, .project-media, .toast, .no-print, .contact-card .cta, .status { display: none !important; }
      a { color: #000; text-decoration: none; }
      .hero { padding: 0 0 10pt; grid-template-columns: 1fr; gap: 0; border-bottom: 1.5pt solid #000; }
      .hero h1 { font-size: 22pt; }
      .title { font-size: 12.5pt; color: #000; margin-top: 2pt; }
      .headline { font-size: 10pt; color: #333; }
      .contact { margin-top: 6pt; gap: 2pt 14pt; font-size: 9.5pt; }
      .contact svg { display: none; }
      section { padding: 11pt 0 0; break-inside: auto; }
      h2 { font-size: 13pt; margin-bottom: 7pt; break-after: avoid; }
      h2::after { background: #999; }
      .lead { font-size: 10.5pt; max-width: none; }
      .skills { gap: 3pt; }
      .skill-group { grid-template-columns: 120pt 1fr; gap: 0 8pt; }
      .skill-group dt { padding-top: 0; font-size: 10pt; color: #000; }
      .tags { display: inline; }
      .tags li, .tags.small li { display: inline; padding: 0; background: none; font-size: 10pt; font-weight: 400; color: #000; }
      .tags li::after { content: ", "; }
      .tags li:last-child::after { content: ""; }
      .jobs { position: static; display: block; }
      .job { position: static; padding: 0 0 8pt 0; break-inside: avoid; }
      .job::before, .job::after { display: none; }
      .job h3 { font-size: 11.5pt; }
      .job-org { font-size: 10pt; color: #222; }
      .job-when { font-size: 10pt; }
      .bullets { margin-top: 3pt; gap: 1pt; padding-left: 14pt; }
      .job .tags { margin-top: 3pt; font-size: 9.5pt; }
      .job .tags::before { content: "Technologies: "; font-weight: 600; }
      html[lang="es"] .job .tags::before { content: "Tecnologías: "; }
      .job-links, .print-hide { display: none !important; }
      .projects { display: block; }
      .project { border: 0; border-radius: 0; break-inside: avoid; margin-bottom: 5pt; }
      .project:hover { transform: none; box-shadow: none; }
      .project-body { padding: 0; gap: 1pt; }
      .project h3 { font-size: 10.5pt; display: inline; }
      .project h3::after { content: " — "; font-weight: 400; }
      .project p { display: inline; color: #000; font-size: 10pt; }
      .project .tags { display: none; }
      .project-url { display: inline; font-size: 9pt; color: #444; }
      .project-url::before { content: " · "; }
      .two-col { grid-template-columns: 1fr; gap: 6pt; }
      .card { border: 0; padding: 0; break-inside: avoid; }
      .card h3 { font-size: 11pt; }
      .card .sub, .card .date, .card p.desc { font-size: 10pt; margin-top: 1pt; }
      .list { gap: 1pt; }
      .list li { font-size: 10pt; }
      .list li::before { background: #000; }
      .list a::after { content: ": " attr(href); color: #444; word-break: break-all; }
      .h3-sub { font-size: 10pt; margin-bottom: 4pt; margin-top: 6pt; }
      .contact-card { padding: 0; }
      footer { border: 0; padding: 8pt 0 0; font-size: 8.5pt; color: #555; }
    }
  </style>
</head>

      /* ---------- tiny DOM helper ---------- */

          main.phone && h('li', null, [ic('phone'), h('a', { href: 'tel:' + main.phone.replace(/[^+\d]/g, '') }, main.phone)]),
          main.location && h('li', null, [ic('pin'), L(main, 'location')]),
          main.website && h('li', null, [ic('globe'), ext('https://' + main.website + '/', main.website)])

        if (years) {

            h('div', { class: 'stat', role: 'listitem' }, [h('b', null, String(companies)), h('span', null, t('stat_companies'))]),
            h('div', { class: 'stat', role: 'listitem' }, [h('b', null, (portfolio.length + challenges.length) + '+'), h('span', null, t('stat_projects'))])

        }

        /* Summary */
        var summary = (L(main, 'summary') || main.bio || '').replace(/\{\{years\}\}/g, years || '');
        app.appendChild(h('section', { id: 'summary', 'aria-labelledby': 'h-summary' }, [
          h('h2', { id: 'h-summary' }, t('h_summary')),

        /* Skills */

        app.appendChild(h('section', { id: 'skills', 'aria-labelledby': 'h-skills' }, [

        /* Projects */
        function projectCard(p) {

        var docLink = main.resumedownload && ext(main.resumedownload, t('gdoc'), { class: 'btn' });
        var copyBtn = h('button', { class: 'btn btn-primary', type: 'button' }, t('copy'));
        copyBtn.addEventListener('click', function () { copy(main.email); });
        app.appendChild(h('section', { id: 'contact', 'aria-labelledby': 'h-contact' }, [
          h('h2', { id: 'h-contact' }, t('h_contact')),

              h('p', { class: 'lead' }, [L(main, 'contactmessage') || t('contact_msg')]),
              h('p', { style: 'margin-top:6px' }, emails.reduce(function (acc, em, i) {
                if (i) acc.push(' · ');
                acc.push(h('a', { href: 'mailto:' + em }, em));

        var ld = {
          '@context': 'https://schema.org', '@type': 'Person',

          email: 'mailto:' + main.email, telephone: main.phone,

          sameAs: social.map(function (s) { return s.url; }),
